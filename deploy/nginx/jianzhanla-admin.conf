server {
    listen 80;
    server_name admin.example.com;
    # 强制跳转 HTTPS（正式上线时放开）
    # return 301 https://$host$request_uri;

    # ---------- 前端静态资源（Vite 构建产物） ----------
    root /www/wwwroot/jianzhanla-admin/frontend/dist;
    index index.html;

    # 前端路由 history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash，可放心长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 后端 API（php-fpm） ----------
    # 前端请求统一走 /api 前缀
    location /api {
        alias /www/wwwroot/jianzhanla-admin/backend/public;
        try_files $uri /api/index.php$is_args$args;

        location ~ \.php$ {
            # 生产环境务必限制只允许访问明确入口
            if ($fastcgi_script_name !~ "^/api/index\.php$") { return 404; }
            fastcgi_pass unix:/tmp/jianzhanla-admin-php-fpm.sock;
            fastcgi_index index.php;
            # alias 场景下手工拼 SCRIPT_FILENAME 与 DOCUMENT_ROOT
            fastcgi_param SCRIPT_FILENAME /www/wwwroot/jianzhanla-admin/backend/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /www/wwwroot/jianzhanla-admin/backend/public;
            include fastcgi_params;
        }
    }

    # 上传文件目录（后端 public/uploads）
    location /uploads {
        alias /www/wwwroot/jianzhanla-admin/backend/public/uploads;
        expires 7d;
    }

    # 禁止访问隐藏文件与敏感文件
    location ~ /\.(ht|git|env) { deny all; }
    location ~* /(vendor|runtime|app|config)/ { deny all; }

    # ---------- 基础安全头 ----------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;

    client_max_body_size 20m;   # 与后端上传大小限制保持一致

    access_log /www/wwwlogs/jianzhanla-admin.access.log;
    error_log  /www/wwwlogs/jianzhanla-admin.error.log;
}
