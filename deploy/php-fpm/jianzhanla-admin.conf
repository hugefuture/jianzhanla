; jianzhanla-admin php-fpm 池配置
; 路径示例（宝塔）：/www/server/php/82/etc/php-fpm.d/jianzhanla-admin.conf
; 重启：/etc/init.d/php-fpm-82 reload  或宝塔面板「PHP-FPM 重启」

[jianzhanla-admin]
; 运行用户（宝塔默认 www）
user = www
group = www

; 用 Unix socket（配合 Nginx upstream fastcgi_pass）
listen = /tmp/jianzhanla-admin-php-fpm.sock
listen.owner = www
listen.group = www
listen.mode = 0660

; 进程管理：动态
pm = dynamic
pm.max_children = 20        ; 按内存调整：单 worker 约 50-80MB
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000      ; 防内存泄漏

; 超时
request_terminate_timeout = 60
request_slowlog_timeout = 5s
slowlog = /www/wwwlogs/jianzhanla-admin-php-slow.log

; 上传与请求大小
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M

; 生产环境关闭暴露 PHP 版本
php_admin_flag[expose_php] = off

; 会话与运行目录
php_admin_value[session.save_path] = /tmp/jianzhanla-sessions
